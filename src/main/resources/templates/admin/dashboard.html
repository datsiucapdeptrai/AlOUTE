<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - ALOUTE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f4f6f9; }
        .stat-card { border: none; border-radius: 15px; color: white; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-5px); }
        .bg-gradient-blue { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .bg-gradient-green { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .bg-gradient-orange { background: linear-gradient(135deg, #f12711 0%, #f5af19 100%); }
        .bg-gradient-pink { background: linear-gradient(135deg, #ec008c 0%, #fc6767 100%); }
    </style>
</head>
<body>

<!-- Navbar (Có thể dùng chung Navbar của bạn) -->
<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/admin}">⚙️ ALOUTE ADMIN</a>
        <div>
            <a th:href="@{/feed}" class="btn btn-outline-light btn-sm me-2">Về trang chủ</a>
            <a th:href="@{/logout}" class="btn btn-danger btn-sm">Đăng xuất</a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">
    <h3 class="mb-4 fw-bold text-secondary">Tổng quan hệ thống</h3>

    <!-- Hàng chứa 4 thẻ thống kê -->
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="card stat-card bg-gradient-blue shadow h-100 p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50">Tổng Người Dùng</h6>
                        <h2 class="fw-bold mb-0" th:text="${stats.totalUsers}">0</h2>
                    </div>
                    <i class="bi bi-people fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card bg-gradient-green shadow h-100 p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50">Bài Viết</h6>
                        <h2 class="fw-bold mb-0" th:text="${stats.totalPosts}">0</h2>
                    </div>
                    <i class="bi bi-file-post fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card bg-gradient-orange shadow h-100 p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50">Bình Luận</h6>
                        <h2 class="fw-bold mb-0" th:text="${stats.totalComments}">0</h2>
                    </div>
                    <i class="bi bi-chat-dots fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card bg-gradient-pink shadow h-100 p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50">Lượt Thích</h6>
                        <h2 class="fw-bold mb-0" th:text="${stats.totalLikes}">0</h2>
                    </div>
                    <i class="bi bi-heart fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Biểu đồ -->
        <div class="col-md-8">
            <div class="card shadow-sm border-0 rounded-3 h-100">
                <div class="card-body">
                    <h5 class="card-title fw-bold text-secondary mb-4">Hoạt động bài viết (7 ngày qua)</h5>
                    <canvas id="myChart" height="100"></canvas>
                </div>
            </div>
        </div>
        
        <!-- Menu quản lý -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0 rounded-3 h-100">
                <div class="card-body">
                    <h5 class="card-title fw-bold text-secondary mb-3">Lối tắt Quản lý</h5>
                    <div class="d-grid gap-2">
                        <a th:href="@{/admin/users}" class="btn btn-outline-primary text-start">
                            <i class="bi bi-person-gear"></i> Quản lý Người dùng
                        </a>
                        <a th:href="@{/admin/posts}" class="btn btn-outline-success text-start">
                            <i class="bi bi-journal-text"></i> Quản lý Bài viết
                        </a>
                        <a th:href="@{/admin/comments}" class="btn btn-outline-warning text-start">
                            <i class="bi bi-chat-square-text"></i> Quản lý Bình luận
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // Lấy dữ liệu từ Backend (Nếu bạn chưa truyền chartData, nó sẽ dùng mảng mặc định để demo)
    const chartData = /*[[${chartData}]]*/ [12, 19, 3, 5, 2, 3, 7];
    
    const ctx = document.getElementById('myChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'CN'],
            datasets: [{
                label: 'Số bài viết mới',
                data: chartData,
                borderColor: '#667eea',
                backgroundColor: 'rgba(102, 126, 234, 0.2)',
                borderWidth: 3,
                tension: 0.4,
                fill: true,
                pointBackgroundColor: '#764ba2',
                pointRadius: 5
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true, grid: { borderDash: [5, 5] } },
                x: { grid: { display: false } }
            }
        }
    });
</script>

</body>
</html>
