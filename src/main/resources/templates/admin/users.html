<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Người dùng - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; }
        .sidebar a { color: #a0a0a0; text-decoration: none; padding: 12px 20px; display: block; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background-color: #0d6efd; color: white; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 d-none d-md-block sidebar p-0 shadow">
            <div class="p-3 text-center border-bottom border-secondary">
                <h4 class="fw-bold text-white mb-0">⚙️ FAKEBOOK</h4>
                <small class="text-muted">Admin Panel</small>
            </div>
            <div class="mt-3">
                <a th:href="@{/admin}"><i class="bi bi-speedometer2 me-2"></i> Tổng quan</a>
                <a th:href="@{/admin/users}" class="active"><i class="bi bi-people me-2"></i> Quản lý Người dùng</a>
                <a th:href="@{/admin/posts}"><i class="bi bi-file-post me-2"></i> Quản lý Bài viết</a>
                <a th:href="@{/admin/comments}"><i class="bi bi-chat-dots me-2"></i> Quản lý Bình luận</a>
                <a th:href="@{/admin/videos}"><i class="bi bi-play-btn me-2"></i> Quản lý Video</a>
                <hr class="text-secondary mx-3">
                <a th:href="@{/feed}"><i class="bi bi-box-arrow-left me-2"></i> Về trang chủ</a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="col-md-10 ms-sm-auto px-md-4 py-4">
            <h2 class="fw-bold text-secondary mb-4">Quản lý Người dùng</h2>

            <!-- Thông báo -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Thanh tìm kiếm -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <form th:action="@{/admin/users}" method="get" class="d-flex">
                        <input type="text" name="keyword" class="form-control me-2" placeholder="Tìm theo username, email hoặc họ tên..." th:value="${keyword}">
                        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-search"></i> Tìm</button>
                    </form>
                </div>
            </div>

            <!-- Bảng danh sách -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Người dùng</th>
                                <th>Email</th>
                                <th>Vai trò</th>
                                <th>Trạng thái</th>
                                <th class="text-end pe-4">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${userPage.content}">
                                <td class="ps-4" th:text="${user.id}">1</td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <img th:if="${user.profile != null and user.profile.avatarUrl != null}" th:src="${user.profile.avatarUrl}" class="rounded-circle me-2" width="40" height="40" style="object-fit:cover;">
                                        <div th:if="${user.profile == null or user.profile.avatarUrl == null}" class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center me-2" style="width:40px; height:40px;">
                                            <span th:text="${#strings.substring(user.fullName, 0, 1)}">U</span>
                                        </div>
                                        <div>
                                            <div class="fw-bold" th:text="${user.fullName}">Họ tên</div>
                                            <small class="text-muted" th:text="'@' + ${user.username}">@username</small>
                                        </div>
                                    </div>
                                </td>
                                <td th:text="${user.email}">email@gmail.com</td>
                                <td>
                                    <!-- Form đổi role -->
                                    <form th:action="@{'/admin/users/' + ${user.id} + '/change-role'}" method="post" class="d-flex align-items-center">
                                        <select name="roleName" class="form-select form-select-sm me-2" style="width: 120px;" onchange="this.form.submit()">
                                            <option value="ROLE_USER" th:selected="${user.roles[0].name.name() == 'ROLE_USER'}">User</option>
                                            <option value="ROLE_MANAGER" th:selected="${user.roles[0].name.name() == 'ROLE_MANAGER'}">Manager</option>
                                            <option value="ROLE_ADMIN" th:selected="${user.roles[0].name.name() == 'ROLE_ADMIN'}">Admin</option>
                                        </select>
                                    </form>
                                </td>
                                <td>
                                    <span th:if="${user.status.name() == 'ACTIVE'}" class="badge bg-success">Hoạt động</span>
                                    <span th:if="${user.status.name() == 'LOCKED'}" class="badge bg-danger">Đã khóa</span>
                                    <span th:if="${user.status.name() == 'DISABLED'}" class="badge bg-warning text-dark">Chờ kích hoạt</span>
                                </td>
                                <td class="text-end pe-4">
                                    <div class="d-flex justify-content-end gap-2">
                                        <!-- NÚT KÍCH HOẠT (Chỉ hiện khi trạng thái là DISABLED) -->
                                        <form th:if="${user.status.name() == 'DISABLED'}" 
                                              th:action="@{'/admin/users/' + ${user.id} + '/activate'}" 
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-success" title="Kích hoạt tài khoản">
                                                <i class="bi bi-check-circle"></i> Kích hoạt
                                            </button>
                                        </form>

                                        <!-- NÚT KHÓA / MỞ KHÓA (Chỉ hiện khi trạng thái là ACTIVE hoặc LOCKED) -->
                                        <form th:if="${user.status.name() != 'DISABLED'}" 
                                              th:action="@{'/admin/users/' + ${user.id} + '/toggle-status'}" 
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm" 
                                                    th:classappend="${user.status.name() == 'LOCKED'} ? 'btn-success' : 'btn-outline-danger'">
                                                <i class="bi" th:classappend="${user.status.name() == 'LOCKED'} ? 'bi-unlock' : 'bi-lock'"></i>
                                                <span th:text="${user.status.name() == 'LOCKED'} ? 'Mở khóa' : 'Khóa'"></span>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Phân trang -->
            <nav class="mt-4" th:if="${userPage.totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${userPage.number == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/users(keyword=${keyword}, page=${userPage.number - 1})}">Trước</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link" th:text="|Trang ${userPage.number + 1} / ${userPage.totalPages}|"></span>
                    </li>
                    <li class="page-item" th:classappend="${userPage.number + 1 == userPage.totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/users(keyword=${keyword}, page=${userPage.number + 1})}">Sau</a>
                    </li>
                </ul>
            </nav>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
