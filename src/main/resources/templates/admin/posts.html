<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Quản lý bài viết</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f0f2f5;
        }

        .sidebar {
            min-height: calc(100vh - 56px);
            background: #212529;
        }

        .sidebar a {
            display: block;
            color: #ced4da;
            padding: 12px 18px;
            margin-bottom: 5px;
            border-radius: 7px;
            text-decoration: none;
        }

        .sidebar a:hover,
        .sidebar a.active {
            color: white;
            background: #0d6efd;
        }

        .post-content {
            max-width: 380px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold"
           th:href="@{/admin}">
            FAKEBOOK ADMIN
        </a>

        <form th:action="@{/logout}" method="post">
            <button class="btn btn-outline-light btn-sm"
                    type="submit">
                Đăng xuất
            </button>
        </form>

    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-3 col-lg-2 sidebar p-3">

            <a th:href="@{/admin}">
                Tổng quan
            </a>

            <a th:href="@{/admin/users}">
                Quản lý tài khoản
            </a>

            <a class="active"
               th:href="@{/admin/posts}">
                Quản lý bài viết
            </a>

            <a th:href="@{/feed}">
                Xem bảng tin
            </a>

        </aside>

        <main class="col-md-9 col-lg-10 p-4">

            <div class="mb-4">
                <h1 class="h3 fw-bold mb-1">
                    Quản lý bài viết
                </h1>

                <div class="text-secondary"
                     th:text="'Tổng cộng: '
                        + ${postPage.totalElements}">
                    Tổng cộng: 0
                </div>
            </div>

            <div th:if="${successMessage}"
                 class="alert alert-success"
                 th:text="${successMessage}">
            </div>

            <div th:if="${errorMessage}"
                 class="alert alert-danger"
                 th:text="${errorMessage}">
            </div>

            <form method="get"
                  th:action="@{/admin/posts}"
                  class="card card-body border-0
                         shadow-sm mb-4">

                <div class="row g-2">
                    <div class="col-md-9">
                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="Tìm nội dung, tiêu đề hoặc tác giả"
                               th:value="${keyword}">
                    </div>

                    <div class="col-md-3 d-grid">
                        <button class="btn btn-primary"
                                type="submit">
                            Tìm kiếm
                        </button>
                    </div>
                </div>
            </form>

            <div class="card border-0 shadow-sm">
                <div class="table-responsive">

                    <table class="table table-hover
                                  align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Tác giả</th>
                                <th>Nội dung</th>
                                <th>Loại</th>
                                <th>Lượt xem</th>
                                <th>Chia sẻ</th>
                                <th>Trạng thái</th>
                                <th class="text-end">
                                    Thao tác
                                </th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="post : ${postPage.content}">

                                <td th:text="${post.id}">
                                    1
                                </td>

                                <td>
                                    <div class="fw-semibold"
                                         th:text="${post.author.fullName}">
                                        Họ tên
                                    </div>

                                    <small class="text-secondary"
                                           th:text="'@'
                                            + ${post.author.username}">
                                        @username
                                    </small>
                                </td>

                                <td>
                                    <div th:if="${post.title != null
                                                and !post.title.isBlank()}"
                                         class="fw-semibold"
                                         th:text="${post.title}">
                                        Tiêu đề
                                    </div>

                                    <div class="post-content text-secondary"
                                         th:text="${post.content}"
                                         th:title="${post.content}">
                                        Nội dung
                                    </div>
                                </td>

                                <td>
                                    <span th:if="${post.videoUrl != null}"
                                          class="badge text-bg-danger">
                                        Video
                                    </span>

                                    <span th:if="${post.videoUrl == null
                                                and post.imageUrl != null}"
                                          class="badge text-bg-info">
                                        Hình ảnh
                                    </span>

                                    <span th:if="${post.videoUrl == null
                                                and post.imageUrl == null}"
                                          class="badge text-bg-secondary">
                                        Văn bản
                                    </span>
                                </td>

                                <td th:text="${post.viewCount}">
                                    0
                                </td>

                                <td th:text="${post.shareCount}">
                                    0
                                </td>

                                <td>
                                    <span th:if="${post.status.name()
                                                == 'ACTIVE'}"
                                          class="badge text-bg-success">
                                        Hoạt động
                                    </span>

                                    <span th:if="${post.status.name()
                                                == 'DELETED'}"
                                          class="badge text-bg-danger">
                                        Đã ẩn
                                    </span>
                                </td>

                                <td class="text-end">

                                    <form th:if="${post.status.name()
                                                 == 'ACTIVE'}"
                                          th:action="@{/admin/posts/{id}/delete(id=${post.id})}"
                                          method="post"
                                          class="d-inline">

                                        <button type="submit"
                                                class="btn btn-danger btn-sm"
                                                onclick="return confirm('Ẩn bài viết này?')">
                                            Ẩn
                                        </button>
                                    </form>

                                    <form th:if="${post.status.name()
                                                 == 'DELETED'}"
                                          th:action="@{/admin/posts/{id}/restore(id=${post.id})}"
                                          method="post"
                                          class="d-inline">

                                        <button type="submit"
                                                class="btn btn-success btn-sm">
                                            Khôi phục
                                        </button>
                                    </form>

                                </td>
                            </tr>

                            <tr th:if="${postPage.empty}">
                                <td colspan="8"
                                    class="text-center
                                           text-secondary py-4">
                                    Không tìm thấy bài viết.
                                </td>
                            </tr>
                        </tbody>
                    </table>

                </div>
            </div>

            <nav th:if="${postPage.totalPages > 1}"
                 class="mt-4">
                <ul class="pagination justify-content-center">

                    <li class="page-item"
                        th:classappend="${postPage.first}
                            ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/admin/posts(
                               page=${postPage.number - 1},
                               keyword=${keyword}
                           )}">
                            Trước
                        </a>
                    </li>

                    <li class="page-item"
                        th:each="number :
                            ${#numbers.sequence(
                                0,
                                postPage.totalPages - 1
                            )}"
                        th:classappend="${number
                            == postPage.number} ? 'active'">

                        <a class="page-link"
                           th:href="@{/admin/posts(
                               page=${number},
                               keyword=${keyword}
                           )}"
                           th:text="${number + 1}">
                            1
                        </a>
                    </li>

                    <li class="page-item"
                        th:classappend="${postPage.last}
                            ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/admin/posts(
                               page=${postPage.number + 1},
                               keyword=${keyword}
                           )}">
                            Sau
                        </a>
                    </li>

                </ul>
            </nav>

        </main>
    </div>
</div>

</body>
</html>
