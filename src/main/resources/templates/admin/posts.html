<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Bài viết - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; }
        .sidebar a { color: #a0a0a0; text-decoration: none; padding: 12px 20px; display: block; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background-color: #0d6efd; color: white; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 d-none d-md-block sidebar p-0 shadow">
            <div class="p-3 text-center border-bottom border-secondary">
                <h4 class="fw-bold text-white mb-0">⚙️ ALOUTE</h4>
                <small class="text-muted">Admin Panel</small>
            </div>
            <div class="mt-3">
                <a th:href="@{/admin}"><i class="bi bi-speedometer2 me-2"></i> Tổng quan</a>
                <a th:href="@{/admin/users}"><i class="bi bi-people me-2"></i> Quản lý Người dùng</a>
                <a th:href="@{/admin/posts}" class="active"><i class="bi bi-file-post me-2"></i> Quản lý Bài viết</a>
                <a th:href="@{/admin/comments}"><i class="bi bi-chat-dots me-2"></i> Quản lý Bình luận</a>
                <a th:href="@{/admin/videos}"><i class="bi bi-play-btn me-2"></i> Quản lý Video</a>
                <hr class="text-secondary mx-3">
                <a th:href="@{/feed}"><i class="bi bi-box-arrow-left me-2"></i> Về trang chủ</a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="col-md-10 ms-sm-auto px-md-4 py-4">
            <h2 class="fw-bold text-secondary mb-4">Quản lý Bài viết</h2>

            <!-- Thông báo -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Thanh tìm kiếm -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <form th:action="@{/admin/posts}" method="get" class="d-flex">
                        <input type="text" name="keyword" class="form-control me-2" placeholder="Tìm nội dung bài viết..." th:value="${keyword}">
                        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-search"></i> Tìm</button>
                    </form>
                </div>
            </div>

            <!-- Bảng danh sách -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Tác giả</th>
                                <th>Nội dung</th>
                                <th>Ngày tạo</th>
                                <th>Trạng thái</th>
                                <th class="text-end pe-4">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="post : ${postPage.content}">
                                <td class="ps-4" th:text="${post.id}">1</td>
                                <td>
                                    <div class="fw-bold" th:text="${post.author.fullName}">Tác giả</div>
                                    <small class="text-muted" th:text="'@' + ${post.author.username}">@username</small>
                                </td>
                                <td>
                                    <div style="max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:text="${post.content}">
                                        Nội dung bài viết
                                    </div>
                                </td>
                                <td th:text="${#temporals.format(post.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2024</td>
                                <td>
                                    <span th:if="${post.status.name() == 'ACTIVE'}" class="badge bg-success">Hiển thị</span>
                                    <span th:if="${post.status.name() == 'DELETED'}" class="badge bg-secondary">Đã ẩn</span>
                                </td>
                                <td class="text-end pe-4">
                                    <!-- Nút Ẩn bài -->
                                    <form th:if="${post.status.name() == 'ACTIVE'}" th:action="@{'/admin/posts/' + ${post.id} + '/delete'}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc muốn ẩn bài viết này?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-eye-slash"></i> Ẩn
                                        </button>
                                    </form>
                                    
                                    <!-- Nút Khôi phục bài -->
                                    <form th:if="${post.status.name() == 'DELETED'}" th:action="@{'/admin/posts/' + ${post.id} + '/restore'}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-success">
                                            <i class="bi bi-arrow-counterclockwise"></i> Khôi phục
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Phân trang -->
            <nav class="mt-4" th:if="${postPage.totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${postPage.number == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/posts(keyword=${keyword}, page=${postPage.number - 1})}">Trước</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link" th:text="|Trang ${postPage.number + 1} / ${postPage.totalPages}|"></span>
                    </li>
                    <li class="page-item" th:classappend="${postPage.number + 1 == postPage.totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/posts(keyword=${keyword}, page=${postPage.number + 1})}">Sau</a>
                    </li>
                </ul>
            </nav>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
