<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông báo | FAKEBOOK</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0f2f5; }
        .noti-card { transition: background 0.2s; }
        .noti-card:hover { background-color: #f5f6f8; }
        .unread-bg { background-color: #e7f3ff !important; }
        .noti-avatar { width: 56px; height: 56px; object-fit: cover; border-radius: 50%; }
        .noti-avatar-fallback { width: 56px; height: 56px; font-size: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background-color: #6c757d; color: white; font-weight: bold; }
    </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/feed}">FAKEBOOK</a>
        <div class="d-flex gap-2">
            <a th:href="@{/feed}" class="btn btn-outline-light btn-sm"><i class="bi bi-house-door"></i> Bảng tin</a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-light btn-sm fw-semibold">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-2" style="max-width: 800px;">
    
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0 fw-bold text-secondary">Thông báo</h3>
        <form th:if="${unreadNotificationCount > 0}" th:action="@{/notifications/read-all}" method="post">
            <button type="submit" class="btn btn-outline-primary btn-sm fw-semibold">
                <i class="bi bi-check2-all"></i> Đánh dấu tất cả đã đọc
            </button>
        </form>
    </div>

    <!-- Trống -->
    <div th:if="${notifications.empty}" class="card shadow-sm border-0 rounded-4">
        <div class="card-body text-center py-5">
            <i class="bi bi-bell-slash fs-1 text-secondary"></i>
            <h5 class="mt-3 fw-bold">Chưa có thông báo</h5>
            <p class="text-secondary mb-0">Các hoạt động mới sẽ xuất hiện tại đây.</p>
        </div>
    </div>

    <!-- Danh sách thông báo -->
    <div th:each="notification : ${notifications.content}" 
         class="card shadow-sm mb-2 border-0 rounded-4 noti-card"
         th:classappend="${!notification.read} ? 'unread-bg' : ''">
         
        <div class="card-body p-3">
            <div class="d-flex align-items-center gap-3">
                
                <!-- Avatar Người Gửi (Sửa từ actor thành sender) -->
                <a th:href="@{'/profile/' + ${notification.sender.username}}" class="text-decoration-none flex-shrink-0">
                    <img th:if="${notification.sender.profile != null and notification.sender.profile.avatarUrl != null}" 
                         th:src="${notification.sender.profile.avatarUrl}" class="noti-avatar">
                         
                    <div th:if="${notification.sender.profile == null or notification.sender.profile.avatarUrl == null}" 
                         class="noti-avatar-fallback" th:text="${#strings.substring(notification.sender.fullName, 0, 1)}">U</div>
                </a>

                <!-- Nội dung thông báo -->
                <div class="flex-grow-1 min-width-0">
                    <div style="font-size: 0.95rem; line-height: 1.4;">
                        <a th:href="@{'/profile/' + ${notification.sender.username}}" class="text-decoration-none text-dark fw-bold" th:text="${notification.sender.fullName}">Người dùng</a>
                        <span class="text-secondary" th:text="${notification.message}">Nội dung thông báo</span>
                    </div>
                    <small class="text-primary fw-semibold mt-1 d-block" th:text="${notification.createdAt}">Thời gian</small>
                </div>

                <!-- Nút Hành Động -->
                <div class="flex-shrink-0">
                    <form th:if="${!notification.read}" th:action="@{/notifications/{id}/read(id=${notification.id})}" method="post">
                        <button type="submit" class="btn btn-primary btn-sm rounded-circle" style="width: 36px; height: 36px;" title="Xem chi tiết">
                            <i class="bi bi-chevron-right"></i>
                        </button>
                    </form>
                    
                    <a th:if="${notification.read and notification.targetUrl != null}" 
                       th:href="${notification.targetUrl}" 
                       class="btn btn-light btn-sm rounded-circle border" style="width: 36px; height: 36px;" title="Xem lại">
                        <i class="bi bi-arrow-right"></i>
                    </a>
                </div>

            </div>
        </div>
    </div>

    <!-- Phân trang -->
    <nav th:if="${notifications.totalPages > 1}" class="d-flex justify-content-center align-items-center gap-3 mt-4">
        <a th:if="${notifications.hasPrevious()}" th:href="@{/notifications(page=${notifications.number - 1})}" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-chevron-left"></i> Trước
        </a>
        <span class="text-secondary fw-semibold">Trang <strong th:text="${notifications.number + 1}">1</strong> / <strong th:text="${notifications.totalPages}">1</strong></span>
        <a th:if="${notifications.hasNext()}" th:href="@{/notifications(page=${notifications.number + 1})}" class="btn btn-outline-primary btn-sm">
            Sau <i class="bi bi-chevron-right"></i>
        </a>
    </nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
