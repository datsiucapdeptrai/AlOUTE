<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - FAKEBOOK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-primary text-center fw-bold">
                        FAKEBOOK
                    </h2>
                    <h5 class="text-center mb-4">Đăng nhập</h5>

                    <div th:if="${param.error}"
                         class="alert alert-danger">
                        Tên đăng nhập, mật khẩu không chính xác hoặc
                        tài khoản chưa được xác thực.
                    </div>

                    <div th:if="${param.logout}"
                         class="alert alert-success">
                        Bạn đã đăng xuất thành công.
                    </div>

                    <div th:if="${param.verified}"
                         class="alert alert-success">
                        Xác thực email thành công. Bạn có thể đăng nhập.
                    </div>

                    <div th:if="${param.resetSuccess}"
                         class="alert alert-success">
                        Đặt lại mật khẩu thành công. Bạn có thể đăng nhập.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Tên đăng nhập hoặc email
                            </label>
                            <input id="username"
                                   type="text"
                                   name="username"
                                   class="form-control"
                                   autocomplete="username"
                                   required
                                   autofocus>
                        </div>

                        <div class="mb-2">
                            <label for="password" class="form-label">
                                Mật khẩu
                            </label>
                            <input id="password"
                                   type="password"
                                   name="password"
                                   class="form-control"
                                   autocomplete="current-password"
                                   required>
                        </div>

                        <div class="text-end mb-3">
                            <a th:href="@{/forgot-password}"
                               class="text-decoration-none">
                                Quên mật khẩu?
                            </a>
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Đăng nhập
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        Chưa có tài khoản?
                        <a th:href="@{/register}">Đăng ký</a>
                    </div>

                    <div class="text-center mt-2">
                        <a th:href="@{/}">Quay lại trang chủ</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
