<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác thực email | FAKEBOOK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card border-0 shadow mx-auto"
         style="max-width: 500px">
        <div class="card-body p-4 p-md-5">
            <h2 class="text-primary text-center fw-bold">
                FAKEBOOK
            </h2>
            <h1 class="h4 text-center mb-3">
                Xác thực email
            </h1>
            <p class="text-secondary text-center">
                Nhập mã OTP 6 số đã gửi đến
                <strong th:text="${email}">email</strong>.
                Mã có hiệu lực trong 5 phút.
            </p>

            <div th:if="${successMessage}"
                 class="alert alert-success"
                 th:text="${successMessage}"></div>

            <div th:if="${verifyError}"
                 class="alert alert-danger"
                 th:text="${verifyError}"></div>

            <form th:action="@{/verify}" method="post">
                <input type="hidden" name="email" th:value="${email}">

                <div class="mb-3">
                    <label for="otp" class="form-label">
                        Mã OTP
                    </label>
                    <input id="otp"
                           type="text"
                           name="otp"
                           class="form-control form-control-lg text-center"
                           inputmode="numeric"
                           pattern="[0-9]{6}"
                           minlength="6"
                           maxlength="6"
                           autocomplete="one-time-code"
                           placeholder="000000"
                           required
                           autofocus>
                </div>

                <button type="submit"
                        class="btn btn-primary w-100">
                    Xác thực tài khoản
                </button>
            </form>

            <form th:action="@{/verify/resend}"
                  method="post"
                  class="mt-3">
                <input type="hidden" name="email" th:value="${email}">
                <button type="submit"
                        class="btn btn-outline-secondary w-100">
                    Gửi lại OTP
                </button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/login}">Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
