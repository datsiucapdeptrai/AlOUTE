<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt lại mật khẩu - ALOUTE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-primary text-center fw-bold">
                        ALOUTE
                    </h2>
                    <h1 class="h4 text-center mb-4">
                        Tạo mật khẩu mới
                    </h1>

                    <div th:if="${errorMessage}"
                         class="alert alert-danger"
                         th:text="${errorMessage}">
                    </div>

                    <form th:if="${!invalidToken}"
                          th:action="@{/reset-password}"
                          method="post">

                        <input type="hidden"
                               name="token"
                               th:value="${token}">

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Mật khẩu mới
                            </label>
                            <input id="password"
                                   type="password"
                                   name="password"
                                   class="form-control"
                                   minlength="8"
                                   maxlength="72"
                                   autocomplete="new-password"
                                   required
                                   autofocus>
                            <div class="form-text">
                                Mật khẩu phải có ít nhất 8 ký tự.
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">
                                Nhập lại mật khẩu mới
                            </label>
                            <input id="confirmPassword"
                                   type="password"
                                   name="confirmPassword"
                                   class="form-control"
                                   minlength="8"
                                   maxlength="72"
                                   autocomplete="new-password"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Đổi mật khẩu
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:if="${invalidToken}"
                           th:href="@{/forgot-password}">
                            Yêu cầu liên kết mới
                        </a>
                        <a th:unless="${invalidToken}"
                           th:href="@{/login}">
                            Quay lại đăng nhập
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
