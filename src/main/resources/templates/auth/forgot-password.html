<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu - FAKEBOOK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h2 class="text-primary text-center fw-bold">
                        FAKEBOOK
                    </h2>
                    <h1 class="h4 text-center mb-3">
                        Quên mật khẩu
                    </h1>
                    <p class="text-secondary text-center mb-4">
                        Nhập email đã đăng ký để nhận liên kết tạo mật khẩu mới.
                    </p>

                    <div th:if="${successMessage}"
                         class="alert alert-success"
                         th:text="${successMessage}">
                    </div>

                    <div th:if="${errorMessage}"
                         class="alert alert-danger"
                         th:text="${errorMessage}">
                    </div>

                    <form th:action="@{/forgot-password}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>
                            <input id="email"
                                   type="email"
                                   name="email"
                                   class="form-control"
                                   th:value="${email}"
                                   autocomplete="email"
                                   placeholder="example@gmail.com"
                                   required
                                   autofocus>
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Gửi liên kết đặt lại mật khẩu
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/login}">Quay lại đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
