<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video | FAKEBOOK</title>
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .video-card video { width: 100%; height: 220px; object-fit: cover; background: #000; }
        .video-description { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/feed}">FAKEBOOK</a>
        <div class="d-flex gap-2 align-items-center">
            <a class="btn btn-light btn-sm" th:href="@{/feed}">Bảng tin</a>
            <span class="text-white" th:text="${currentUser.fullName}">Người dùng</span>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 mb-1">Video</h1>
            <p class="text-secondary mb-0">Mỗi trang hiển thị 3 video.</p>
        </div>
        <a th:href="@{/feed}" class="btn btn-primary">Đăng video</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body d-flex flex-wrap gap-2 align-items-center">
            <a th:href="@{/videos}" class="btn btn-sm"
               th:classappend="${selectedCategoryId == null} ? 'btn-primary' : 'btn-outline-primary'">
                Tất cả
            </a>
            <a th:each="category : ${categories}"
               th:href="@{/videos(category=${category.id})}"
               class="btn btn-sm"
               th:classappend="${selectedCategoryId == category.id} ? 'btn-primary' : 'btn-outline-primary'">
                <span th:text="${category.name}">Thể loại</span>
                (<span th:text="${videoCounts[category.id]}">0</span>)
            </a>
        </div>
    </div>

    <div th:if="${videos.empty}" class="alert alert-info">Chưa có video trong thể loại này.</div>

    <div class="row g-4">
        <div th:each="post : ${videos.content}" class="col-lg-4">
            <article class="card video-card h-100 shadow-sm">
                <video controls preload="metadata" class="tracked-video card-img-top"
                       th:src="${post.videoUrl}" th:poster="${post.videoPosterUrl}"
                       th:attr="data-view-url=@{/videos/{id}/view(id=${post.id})},data-post-id=${post.id}"></video>
                <div class="card-body">
                    <h2 class="h5" th:text="${post.title}">Tiêu đề</h2>
                    <div class="small text-secondary mb-2">
                        <span th:text="${post.videoCategory != null ? post.videoCategory.name : 'Chưa phân loại'}">Category</span>
                        <span> · </span>
                        <span th:text="${post.author.fullName}">Tác giả</span>
                    </div>
                    <p class="video-description" th:text="${post.content}">Mô tả</p>
                    <div class="small text-secondary d-flex flex-wrap gap-3 mb-3">
                        <span><strong th:id="|view-count-${post.id}|" th:text="${post.viewCount}">0</strong> view</span>
                        <span><strong th:text="${post.shareCount}">0</strong> share</span>
                        <span><strong th:text="${likeCounts[post.id]}">0</strong> like</span>
                    </div>
                    <a th:href="@{/videos/{id}(id=${post.id})}" class="btn btn-outline-primary w-100">Xem chi tiết</a>
                </div>
            </article>
        </div>
    </div>

    <nav th:if="${videos.totalPages > 1}" class="mt-4" aria-label="Phân trang video">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${videos.first} ? 'disabled'">
                <a class="page-link" th:href="@{/videos(category=${selectedCategoryId},page=${videos.number - 1})}">Trước</a>
            </li>
            <li th:each="number : ${#numbers.sequence(0, videos.totalPages - 1)}"
                class="page-item" th:classappend="${number == videos.number} ? 'active'">
                <a class="page-link" th:href="@{/videos(category=${selectedCategoryId},page=${number})}"
                   th:text="${number + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${videos.last} ? 'disabled'">
                <a class="page-link" th:href="@{/videos(category=${selectedCategoryId},page=${videos.number + 1})}">Sau</a>
            </li>
        </ul>
    </nav>
</main>
<script th:src="@{/js/video-interactions.js}"></script>
</body>
</html>
