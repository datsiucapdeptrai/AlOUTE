<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tìm kiếm - FAKEBOOK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<!-- Nhúng Navbar của bạn vào đây (nếu có) -->
<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold" th:href="@{/}">FAKEBOOK</a>
        <form class="d-flex w-50" th:action="@{/search}" method="get">
            <div class="input-group">
                <input type="text" name="keyword" class="form-control" th:value="${keyword}" placeholder="Tìm kiếm người dùng...">
                <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
            </div>
        </form>
    </div>
</nav>

<div class="container" style="max-width: 800px;">
    <h4 class="mb-4">Kết quả tìm kiếm cho: "<span th:text="${keyword}" class="text-primary"></span>"</h4>

    <div th:if="${message}" class="alert alert-warning" th:text="${message}"></div>

    <!-- Danh sách User -->
    <div class="row g-3">
        <div class="col-md-6" th:each="user : ${users}">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex align-items-center">
                    <img th:src="${user.profile != null && user.profile.avatarUrl != null ? user.profile.avatarUrl : '/images/default-avatar.png'}" 
                         class="rounded-circle me-3" style="width: 60px; height: 60px; object-fit: cover;" alt="Avatar">
                    <div>
                        <h6 class="mb-1 fw-bold" th:text="${user.fullName}"></h6>
                        <div class="text-muted small">@<span th:text="${user.username}"></span></div>
                        <a th:href="@{'/profile/' + ${user.username}}" class="btn btn-sm btn-outline-primary mt-2">Xem trang cá nhân</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Phân trang -->
    <nav class="mt-4" th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/search(keyword=${keyword}, page=${currentPage - 1})}">Trước</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="|Trang ${currentPage + 1} / ${totalPages}|"></span>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/search(keyword=${keyword}, page=${currentPage + 1})}">Sau</a>
            </li>
        </ul>
    </nav>
</div>

</body>
</html>
