<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tin nhắn | FAKEBOOK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        #messageList {
            display: flex;
            flex-direction: column-reverse;
        }

        .message-bubble {
            max-width: 80%;
        }

        .message-content {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/feed}">FAKEBOOK</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/feed}">Bảng tin</a>
    </div>
</nav>

<main class="container py-4">
    <h3 class="mb-3">Tin nhắn</h3>

    <div class="row g-3">
        <aside class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold">Bạn bè</div>

                <div class="list-group list-group-flush">
                    <div th:if="${#lists.isEmpty(friends)}"
                         class="list-group-item text-secondary">
                        Chưa có bạn bè để trò chuyện.
                    </div>

                    <a th:each="friend : ${friends}"
                       th:href="@{/messages/{id}(id=${friend.userId})}"
                       th:attr="data-friend-id=${friend.userId}"
                       class="list-group-item list-group-item-action"
                       th:classappend="${otherUser != null and friend.userId == otherUser.id}
                           ? 'active' : ''">
                        <span class="new-message-badge badge bg-danger float-end"
                              th:classappend="${unreadCounts[friend.userId] == null or unreadCounts[friend.userId] == 0} ? 'd-none' : ''"
                              th:text="${unreadCounts[friend.userId] ?: 0}">
                            0
                        </span>
                        <strong th:text="${friend.fullName}">Tên bạn bè</strong>
                        <small class="d-block" th:text="'@' + ${friend.username}">
                            @username
                        </small>
                    </a>
                </div>
            </div>
        </aside>

        <section class="col-lg-8">
            <div th:if="${otherUser == null}" class="card shadow-sm">
                <div class="card-body text-center text-secondary py-5">
                    Chọn một người bạn để bắt đầu trò chuyện.
                </div>
            </div>

            <div th:if="${otherUser != null}" class="card shadow-sm">
                <div class="card-header fw-semibold"
                     th:text="|Trò chuyện với ${otherUser.fullName}|">
                    Trò chuyện
                </div>

                <div class="card-body">
                    <div th:if="${messageError}"
                         class="alert alert-danger"
                         th:text="${messageError}"></div>

                    <form id="messageForm"
                          th:action="@{/messages/{id}(id=${otherUser.id})}"
                          method="post"
                          class="d-flex gap-2 mb-4">
                        <input id="messageContent"
                               type="text"
                               name="content"
                               class="form-control"
                               maxlength="2000"
                               placeholder="Nhập tin nhắn..."
                               required>
                        <button type="submit" class="btn btn-primary">Gửi</button>
                    </form>

                    <form id="readForm"
                          th:action="@{/messages/{id}/read(id=${otherUser.id})}"
                          method="post"
                          class="d-none"></form>

                    <div id="newMessageHint"
                         class="alert alert-info d-none mb-3">
                        Có tin nhắn mới.
                        <a th:href="@{/messages/{id}(id=${otherUser.id})}">
                            Xem cuộc trò chuyện mới nhất
                        </a>
                    </div>

                    <div id="messageList"
                         th:attr="data-other-user-id=${otherUser.id},data-page=${conversation.number}">
                        <div th:if="${conversation.empty}"
                             id="emptyConversation"
                             class="text-center text-secondary py-4">
                            Chưa có tin nhắn.
                        </div>

                        <div th:each="message : ${conversation.content}"
                             class="d-flex mb-2"
                             th:attr="data-message-id=${message.id},data-own=${message.senderId == currentUserId}"
                             th:classappend="${message.senderId == currentUserId}
                                 ? 'justify-content-end' : 'justify-content-start'">
                            <div class="message-bubble rounded px-3 py-2"
                                 th:classappend="${message.senderId == currentUserId}
                                     ? 'bg-primary text-white' : 'bg-white border'">
                                <div class="small fw-semibold"
                                     th:text="${message.senderFullName}">
                                    Người gửi
                                </div>
                                <div class="message-content"
                                     th:text="${message.content}">
                                    Nội dung
                                </div>
                                <small class="d-block opacity-75"
                                       th:text="${message.createdAt}">
                                    Thời gian
                                </small>
                                <small th:if="${message.senderId == currentUserId}"
                                       class="read-status d-block opacity-75"
                                       th:text="${message.read} ? 'Đã xem' : 'Đã gửi'">
                                    Đã gửi
                                </small>
                            </div>
                        </div>
                    </div>

                    <nav th:if="${conversation.totalPages > 1}"
                         class="d-flex justify-content-center align-items-center gap-2 mt-3">
                        <a th:if="${conversation.hasPrevious()}"
                           th:href="@{/messages/{id}(id=${otherUser.id},page=${conversation.number - 1})}"
                           class="btn btn-outline-primary btn-sm">
                            Tin mới hơn
                        </a>
                        <span class="small text-secondary"
                              th:text="|Trang ${conversation.number + 1}/${conversation.totalPages}|">
                            Trang
                        </span>
                        <a th:if="${conversation.hasNext()}"
                           th:href="@{/messages/{id}(id=${otherUser.id},page=${conversation.number + 1})}"
                           class="btn btn-outline-primary btn-sm">
                            Tin cũ hơn
                        </a>
                    </nav>
                </div>
            </div>
        </section>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.min.js"></script>
<script>
    const form = document.getElementById("messageForm");
    const readForm = document.getElementById("readForm");
    const messageList = document.getElementById("messageList");

    let readTimer;
    let needsRead = false;
    let lastReadId = 0;

    function updateReadStatus(readUpToId) {
        const id = Number(readUpToId);
        if (!Number.isSafeInteger(id) || !messageList) return;

        lastReadId = Math.max(lastReadId, id);

        messageList.querySelectorAll('[data-own="true"]').forEach(row => {
            if (Number(row.dataset.messageId) <= lastReadId) {
                const label = row.querySelector(".read-status");
                if (label) label.textContent = "Đã xem";
            }
        });
    }

    function unreadBadgeFor(senderId) {
        const link = Array.from(
            document.querySelectorAll("[data-friend-id]")
        ).find(
            item => item.dataset.friendId === String(senderId)
        );

        return link && link.querySelector(".new-message-badge");
    }

    function increaseUnread(senderId) {
        const badge = unreadBadgeFor(senderId);
        if (!badge) return;

        badge.textContent =
            String((Number(badge.textContent) || 0) + 1);
        badge.classList.remove("d-none");
    }

    function scheduleRead() {
        if (!messageList ||
                messageList.dataset.page !== "0" ||
                !readForm) {
            return;
        }

        if (document.visibilityState !== "visible") {
            needsRead = true;
            return;
        }

        needsRead = false;
        clearTimeout(readTimer);

        readTimer = setTimeout(async function () {
            try {
                const response = await fetch(readForm.action, {
                    method: "POST",
                    body: new FormData(readForm)
                });

                if (!response.ok) {
                    throw new Error("Không thể đánh dấu đã đọc.");
                }

                const badge = unreadBadgeFor(
                    messageList.dataset.otherUserId
                );

                if (badge) {
                    badge.textContent = "0";
                    badge.classList.add("d-none");
                }
            } catch (error) {
                console.error(error);
            }
        }, 250);
    }

    document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible" && needsRead) {
            scheduleRead();
        }
    });

    function showNewMessageHint() {
        const hint = document.getElementById("newMessageHint");
        if (hint) hint.classList.remove("d-none");
    }

    function renderMessage(data, isOwn) {
        if (!messageList || !data || data.id == null) return;

        if (Array.from(messageList.children).some(
                row => row.dataset.messageId === String(data.id))) {
            return;
        }

        const empty = document.getElementById("emptyConversation");
        if (empty) empty.remove();

        const row = document.createElement("div");
        row.className = "d-flex mb-2 " +
            (isOwn
                ? "justify-content-end"
                : "justify-content-start");
        row.dataset.messageId = String(data.id);
        row.dataset.own = String(isOwn);

        const bubble = document.createElement("div");
        bubble.className = "message-bubble rounded px-3 py-2 " +
            (isOwn
                ? "bg-primary text-white"
                : "bg-white border");

        const sender = document.createElement("div");
        sender.className = "small fw-semibold";
        sender.textContent =
            data.senderFullName ||
            data.senderUsername ||
            "Người dùng";

        const content = document.createElement("div");
        content.className = "message-content";
        content.textContent = data.content;

        const time = document.createElement("small");
        time.className = "d-block opacity-75";
        time.textContent = data.createdAt;

        bubble.append(sender, content, time);

        if (isOwn) {
            const readStatus = document.createElement("small");
            readStatus.className =
                "read-status d-block opacity-75";
            readStatus.textContent =
                data.read || Number(data.id) <= lastReadId
                    ? "Đã xem"
                    : "Đã gửi";
            bubble.appendChild(readStatus);
        }

        row.appendChild(bubble);

        // CSS đảo chiều: thêm đầu DOM sẽ hiển thị cuối cuộc trò chuyện.
        messageList.prepend(row);
    }

    if (form) {
        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const input = document.getElementById("messageContent");
            const button =
                form.querySelector('button[type="submit"]');
            button.disabled = true;

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    body: new FormData(form),
                    headers: {
                        "Accept": "application/json",
                        "X-Requested-With": "XMLHttpRequest"
                    }
                });

                if (!(response.headers.get("content-type") || "")
                        .includes("application/json")) {
                    throw new Error(
                        "Máy chủ chưa trả JSON. " +
                        "Hãy kiểm tra DirectMessageController."
                    );
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Không thể gửi tin nhắn."
                    );
                }

                if (messageList.dataset.page === "0") {
                    renderMessage(data, true);
                } else {
                    showNewMessageHint();
                }

                input.value = "";
                input.focus();
            } catch (error) {
                alert(error.message || "Không thể gửi tin nhắn.");
            } finally {
                button.disabled = false;
            }
        });
    }

    if (typeof StompJs === "undefined") {
        console.error(
            "Không tải được StompJS; nhận tin trực tiếp " +
            "tạm thời không hoạt động."
        );
    } else {
        const protocol =
            location.protocol === "https:" ? "wss:" : "ws:";

        const stompClient = new StompJs.Client({
            brokerURL:
                protocol + "//" + location.host + "/ws",
            reconnectDelay: 5000
        });

        stompClient.onConnect = function () {
            stompClient.subscribe(
                "/user/queue/messages",
                function (frame) {
                    let data;

                    try {
                        data = JSON.parse(frame.body);
                    } catch (error) {
                        console.error(
                            "Dữ liệu tin nhắn không hợp lệ:",
                            error
                        );
                        return;
                    }

                    if (messageList &&
                            String(data.senderId) ===
                            messageList.dataset.otherUserId) {
                        if (messageList.dataset.page === "0") {
                            renderMessage(data, false);
                            scheduleRead();
                        } else {
                            showNewMessageHint();
                            increaseUnread(data.senderId);
                        }
                        return;
                    }

                    increaseUnread(data.senderId);
                }
            );

            stompClient.subscribe(
                "/user/queue/messages-read",
                function (frame) {
                    try {
                        const receipt = JSON.parse(frame.body);

                        if (messageList &&
                                String(receipt.readerId) ===
                                messageList.dataset.otherUserId) {
                            updateReadStatus(
                                receipt.readUpToId
                            );
                        }
                    } catch (error) {
                        console.error(
                            "Dữ liệu trạng thái đã xem không hợp lệ:",
                            error
                        );
                    }
                }
            );
        };

        stompClient.onStompError = function (frame) {
            console.error(
                "Lỗi WebSocket:",
                frame.headers.message
            );
        };

        stompClient.activate();
    }

    // Khi mở cuộc trò chuyện, đánh dấu tin đã thấy bằng POST.
    if (messageList && messageList.dataset.page === "0") {
        scheduleRead();
    }
</script>
</body>
</html>
