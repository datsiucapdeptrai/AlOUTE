<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Bạn bè | FAKEBOOK</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold"
           th:href="@{/feed}">
            FAKEBOOK
        </a>

        <div class="d-flex gap-2">
            <a class="btn btn-light btn-sm"
               th:href="@{/feed}">
                Bảng tin
            </a>

            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm">
                    Đăng xuất
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4">

    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>

    <!-- Lời mời đã nhận -->
    <section class="card shadow-sm mb-4">
        <div class="card-body">

            <h4>Lời mời kết bạn</h4>

            <p th:if="${#lists.isEmpty(receivedRequests)}"
               class="text-secondary mb-0">
                Bạn chưa có lời mời kết bạn.
            </p>

            <div th:each="request : ${receivedRequests}"
                 class="border-top py-3 d-flex
                        justify-content-between align-items-center">

                <div>
                    <strong th:text="${request.fullName}">
                        Họ tên
                    </strong>

                    <div class="text-secondary"
                         th:text="'@' + ${request.username}">
                        @username
                    </div>
                </div>

                <div class="d-flex gap-2">

                    <form th:action="@{/friends/{id}/accept(
                                id=${request.friendshipId})}"
                          method="post">

                        <button class="btn btn-primary btn-sm">
                            Chấp nhận
                        </button>
                    </form>

                    <form th:action="@{/friends/{id}/reject(
                                id=${request.friendshipId})}"
                          method="post">

                        <button class="btn btn-secondary btn-sm">
                            Từ chối
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </section>

    <!-- Danh sách bạn bè -->
    <section class="card shadow-sm mb-4">
        <div class="card-body">

            <h4>Bạn bè</h4>

            <p th:if="${#lists.isEmpty(friends)}"
               class="text-secondary mb-0">
                Bạn chưa có bạn bè.
            </p>

            <div th:each="friend : ${friends}"
                 class="border-top py-3 d-flex
                        justify-content-between align-items-center">

                <div>
                    <strong th:text="${friend.fullName}">
                        Họ tên
                    </strong>

                    <div class="text-secondary"
                         th:text="'@' + ${friend.username}">
                        @username
                    </div>
                </div>

                <form th:action="@{/friends/{id}/remove(
                            id=${friend.friendshipId})}"
                      method="post"
                      onsubmit="return confirm('Bạn có chắc muốn hủy kết bạn?')">

                    <button class="btn btn-outline-danger btn-sm">
                        Hủy kết bạn
                    </button>
                </form>
            </div>

        </div>
    </section>

    <!-- Tìm kiếm -->
    <section class="card shadow-sm">
        <div class="card-body">

            <h4>Tìm người dùng</h4>

            <form th:action="@{/friends}"
                  method="get"
                  class="d-flex gap-2 mb-4">

                <input type="text"
                       name="q"
                       class="form-control"
                       th:value="${keyword}"
                       placeholder="Nhập họ tên hoặc username">

                <button class="btn btn-primary">
                    Tìm kiếm
                </button>
            </form>

            <p th:if="${#lists.isEmpty(searchResults)}"
               class="text-secondary">
                Không tìm thấy người dùng.
            </p>

            <div th:each="result : ${searchResults}"
                 class="border-top py-3 d-flex
                        justify-content-between align-items-center">

                <div>
                    <strong th:text="${result.fullName}">
                        Họ tên
                    </strong>

                    <div class="text-secondary"
                         th:text="'@' + ${result.username}">
                        @username
                    </div>
                </div>

                <div>
                    <!-- Chưa có quan hệ hoặc đã từ chối -->
                    <form th:if="${result.status == null
                            or result.status.name() == 'REJECTED'}"
                          th:action="@{/friends/request/{userId}(
                                userId=${result.userId})}"
                          method="post">

                        <button class="btn btn-primary btn-sm">
                            Kết bạn
                        </button>
                    </form>

                    <!-- Đã gửi lời mời -->
                    <div th:if="${result.status != null
                                and result.status.name() == 'PENDING'
                                and result.requestedByCurrentUser}"
                         class="d-flex gap-2 align-items-center">

                        <span class="text-secondary">
                            Đã gửi lời mời
                        </span>

                        <form th:action="@{/friends/{id}/cancel(
                                    id=${result.friendshipId})}"
                              method="post">

                            <button class="btn btn-outline-danger btn-sm">
                                Thu hồi
                            </button>
                        </form>
                    </div>

                    <!-- Nhận lời mời từ người này -->
                    <div th:if="${result.status != null
                                and result.status.name() == 'PENDING'
                                and !result.requestedByCurrentUser}"
                         class="d-flex gap-2">

                        <form th:action="@{/friends/{id}/accept(
                                    id=${result.friendshipId})}"
                              method="post">

                            <button class="btn btn-primary btn-sm">
                                Chấp nhận
                            </button>
                        </form>

                        <form th:action="@{/friends/{id}/reject(
                                    id=${result.friendshipId})}"
                              method="post">

                            <button class="btn btn-secondary btn-sm">
                                Từ chối
                            </button>
                        </form>
                    </div>

                    <!-- Đã là bạn bè -->
                    <span th:if="${result.status != null
                                and result.status.name() == 'ACCEPTED'}"
                          class="badge text-bg-success">
                        Bạn bè
                    </span>
                </div>
            </div>

        </div>
    </section>

</main>

</body>
</html>
