<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chỉnh sửa hồ sơ | FAKEBOOK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .avatar-preview {
            width: 120px; height: 120px;
            border-radius: 50%; object-fit: cover;
            border: 3px solid #dee2e6;
        }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/feed}">FAKEBOOK</a>
        <a class="btn btn-light btn-sm" th:href="@{/feed}">Quay lại bảng tin</a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-4">Chỉnh sửa hồ sơ</h3>

                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <div th:if="${updateError}" class="alert alert-danger" th:text="${updateError}"></div>

                    <!-- Avatar hiện tại + form upload -->
                    <div class="text-center mb-4">
                        <img th:if="${currentUser.profile != null and currentUser.profile.avatarUrl != null}"
                             th:src="${currentUser.profile.avatarUrl}"
                             class="avatar-preview mb-2" alt="Avatar">
                        <div th:if="${currentUser.profile == null or currentUser.profile.avatarUrl == null}"
                             class="avatar-preview bg-secondary text-white d-inline-flex align-items-center justify-content-center mb-2">
                            <span style="font-size: 48px;"
                                  th:text="${#strings.substring(currentUser.fullName, 0, 1)}">U</span>
                        </div>
                        <p class="text-secondary small mb-0">
                            Ảnh đại diện hiện tại
                        </p>
                    </div>

                    <!-- Form chính -->
                    <form th:action="@{/profile/edit}"
                          th:object="${profileForm}"
                          method="post"
                          enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label">Ảnh đại diện mới</label>
                            <input type="file"
                                   class="form-control"
                                   th:field="*{avatar}"
                                   accept="image/jpeg,image/png,image/gif">
                            <small class="text-secondary">JPG, PNG hoặc GIF; tối đa 5MB.</small>
                        </div>

                        <hr>

                        <div class="mb-3">
                            <label class="form-label">Họ và tên</label>
                            <input type="text" class="form-control"
                                   th:field="*{fullName}"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Giới thiệu</label>
                            <textarea class="form-control" rows="4"
                                      th:field="*{bio}"
                                      th:classappend="${#fields.hasErrors('bio')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:errors="*{bio}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" class="form-control"
                                   th:field="*{phone}"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ngày sinh</label>
                            <input type="date" class="form-control"
                                   th:field="*{dateOfBirth}"
                                   th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{dateOfBirth}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Địa điểm</label>
                            <input type="text" class="form-control"
                                   th:field="*{location}"
                                   th:classappend="${#fields.hasErrors('location')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{location}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                        <a th:href="@{/profile}" class="btn btn-secondary">Hủy</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
