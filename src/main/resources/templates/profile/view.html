<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Hồ sơ của ' + ${profileUser.fullName} + ' | FAKEBOOK'">Hồ sơ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .cover-photo {
            height: 200px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .profile-avatar {
            width: 140px; height: 140px;
            border: 4px solid white; border-radius: 50%;
            object-fit: cover; margin-top: -70px;
            background: #6c757d; color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 56px; font-weight: bold;
        }
        .stat-card { text-align: center; padding: 12px; }
        .stat-number { font-size: 22px; font-weight: bold; color: #0d6efd; }
        .stat-label { font-size: 13px; color: #6c757d; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/feed}">FAKEBOOK</a>
        <a class="btn btn-light btn-sm" th:href="@{/feed}">Quay lại bảng tin</a>
    </div>
</nav>

<main class="container py-4">
    <div class="card shadow-sm mb-4">
        <div class="cover-photo"></div>
        <div class="card-body">
            <div class="d-flex align-items-end gap-3 flex-wrap">
                <img th:if="${profileUser.profile != null and profileUser.profile.avatarUrl != null}"
                     th:src="${profileUser.profile.avatarUrl}"
                     class="profile-avatar" alt="Avatar">
                <div th:if="${profileUser.profile == null or profileUser.profile.avatarUrl == null}"
                     class="profile-avatar">
                    <span th:text="${#strings.substring(profileUser.fullName, 0, 1)}">U</span>
                </div>
                <div class="flex-grow-1">
                    <h3 class="mb-0" th:text="${profileUser.fullName}">Họ tên</h3>
                    <p class="text-secondary mb-0" th:text="'@' + ${profileUser.username}">@username</p>
                </div>
                <div>
                    <a th:if="${isOwnProfile}"
                       th:href="@{/profile/edit}"
                       class="btn btn-primary">Chỉnh sửa hồ sơ</a>
                    <a th:if="${!isOwnProfile}"
                       th:href="@{/friends}"
                       class="btn btn-outline-primary">Kết bạn</a>
                </div>
            </div>

            <!-- Thông tin cá nhân -->
            <div class="mt-3" th:if="${profileUser.profile != null}">
                <p class="mb-1" th:if="${profileUser.profile.bio != null}">
                    <strong>Giới thiệu:</strong>
                    <span th:text="${profileUser.profile.bio}">Bio</span>
                </p>
                <p class="mb-1" th:if="${profileUser.profile.location != null}">
                    <strong>Địa điểm:</strong>
                    <span th:text="${profileUser.profile.location}">Location</span>
                </p>
                <p class="mb-1" th:if="${profileUser.profile.dateOfBirth != null}">
                    <strong>Ngày sinh:</strong>
                    <span th:text="${profileUser.profile.dateOfBirth}">Date</span>
                </p>
                <p class="mb-1" th:if="${profileUser.email != null}">
                    <strong>Email:</strong>
                    <span th:text="${profileUser.email}">Email</span>
                </p>
            </div>

            <!-- Thống kê -->
            <div class="row mt-4 border-top pt-3">
                <div class="col-4 stat-card">
                    <div class="stat-number" th:text="${stats.postCount}">0</div>
                    <div class="stat-label">Bài viết</div>
                </div>
                <div class="col-4 stat-card">
                    <div class="stat-number" th:text="${stats.friendCount}">0</div>
                    <div class="stat-label">Bạn bè</div>
                </div>
                <div class="col-4 stat-card">
                    <div class="stat-number" th:text="${stats.likeCount}">0</div>
                    <div class="stat-label">Lượt thích</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Danh sách bài viết -->
    <h4 class="mb-3">Bài viết gần đây</h4>

    <div th:if="${posts.empty}" class="card shadow-sm">
        <div class="card-body text-center py-4 text-secondary">
            Người dùng này chưa có bài viết nào.
        </div>
    </div>

    <article th:each="post : ${posts.content}" class="card shadow-sm mb-3">
        <div class="card-body">
            <small class="text-secondary" th:text="${post.createdAt}">Thời gian</small>
            <p class="post-content mt-2 mb-0" th:text="${post.content}">Nội dung</p>
            <img th:if="${post.imageUrl != null}"
                 th:src="${post.imageUrl}"
                 class="img-fluid rounded mt-2" alt="Ảnh bài viết">
        </div>
    </article>

    <!-- Phân trang -->
    <nav th:if="${posts.totalPages > 1}" class="d-flex justify-content-center gap-3 mt-4">
        <a th:if="${posts.hasPrevious()}"
           th:href="@{/profile/{u}(u=${profileUser.username}, page=${posts.number - 1})}"
           class="btn btn-outline-primary btn-sm">Trang trước</a>
        <span>Trang <strong th:text="${posts.number + 1}">1</strong> /
            <strong th:text="${posts.totalPages}">1</strong></span>
        <a th:if="${posts.hasNext()}"
           th:href="@{/profile/{u}(u=${profileUser.username}, page=${posts.number + 1})}"
           class="btn btn-outline-primary btn-sm">Trang sau</a>
    </nav>
</main>
</body>
</html>
